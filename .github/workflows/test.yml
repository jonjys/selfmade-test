name: Tester

on:
  push:
    branches: [main, "claude/**"]
  pull_request:
    branches: [main]

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: scanner/requirements.txt

      - name: Installera beroenden
        working-directory: scanner
        run: |
          pip install -r requirements.txt pytest
          python -m playwright install --with-deps chromium

      - name: Kör testerna
        working-directory: scanner
        run: python -m pytest tests/ -v

      - name: Kontrollera att den publicerade sidan är ombyggd
        run: |
          # public/index.html är incheckad och är det som publiceras. Ändras
          # källfilen utan att bygget körs ligger den gamla sidan kvar ute,
          # vilket inte syns någonstans förrän någon besöker sajten.
          python3 site/build.py
          if ! git diff --quiet -- public/index.html; then
            echo "::error::public/index.html är inte ombyggd efter ändring i site/index.src.html."
            echo "Kör: python3 site/build.py && git add public/index.html"
            git diff --stat -- public/index.html
            exit 1
          fi

  webb:
    # Bygger Next-appen med exakt de kommandon Vercel kör. Utan det här
    # jobbet upptäcks ett trasigt bygge först som en röd bock hos Vercel,
    # där loggen ligger bakom en annan inloggning än repot.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Installera beroenden
        run: cd web && npm ci

      - name: Bygg
        run: cd web && npm run build

      - name: Kontrollera att exporten innehåller det den ska
        run: |
          # Ett bygge kan gå igenom och ändå sakna sidorna, om
          # generateStaticParams tystnar när datafilen är tom.
          test -f web/out/index.html
          if [ ! -d web/out/status ]; then
            echo "::error::web/out/status saknas — inga kundsidor genererades."
            exit 1
          fi
