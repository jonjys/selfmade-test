<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <title>Testbutiken</title>
  <style>
    body { font-family: sans-serif; margin: 0; }
    /* Fokusmarkering borttagen utan ersättning — custom-no-visible-focus */
    a:focus, button:focus { outline: none; }
    .rabatt { color: #b0b0b0; background: #ffffff; }  /* för låg kontrast */
    .falsk-knapp { cursor: pointer; padding: 8px; background: #eee; display: inline-block; }
    nav { background: #222; padding: 12px; }
    nav a { color: #ddd; margin-right: 12px; }

    /* Mönster som inte ska ge utslag */
    .kort { cursor: pointer; display: block; padding: 10px; }
    .kort span { display: block; }          /* ärver pekaren från .kort */
    .overlay { cursor: pointer; pointer-events: none; width: 200px; height: 40px; }
    .visually-hidden {
      position: absolute; width: 1px; height: 1px;
      overflow: hidden; clip: rect(0 0 0 0); cursor: pointer;
    }
    .kort-rubrik { cursor: pointer; }
    .omslag { cursor: pointer; padding: 10px; }
    .karusellpunkt { cursor: pointer; display: inline-block; padding: 6px; }
    .overlagg { cursor: pointer; width: 100px; height: 100px; }
  </style>
</head>
<!--
  Testsajt med avsiktliga tillgänglighetsbrister.
  Varje brist är kommenterad med vilken regel den ska utlösa, så att testet
  går att läsa som en kravspecifikation.

  html-taggen saknar medvetet lang, vilket ska utlösa html-has-lang.

  Notera att h1 följt av h3 INTE ger något utslag: axe klassar heading-order
  som best-practice, inte som WCAG-krav, och vi kör bara WCAG-reglerna.
-->
<body>
  <nav>
    <!-- Ingen skip-länk någonstans — custom-no-skip-link -->
    <a href="/">Hem</a>
    <a href="/products/skor">Skor</a>
    <a href="/cart">Varukorg</a>
    <!-- link-name: länk utan text -->
    <a href="/kampanj"><span></span></a>
  </nav>

  <div>
    <!-- heading-order: hoppar från h1 till h3 -->
    <h1>Testbutiken</h1>
    <h3>Veckans erbjudanden</h3>

    <!-- image-alt: saknar alt -->
    <img src="/bilder/kampanj.jpg" width="200" height="100">

    <p class="rabatt">Just nu 20 % rabatt pa alla skor</p>

    <!-- label: inmatningsfält utan etikett -->
    <form>
      <input type="text" name="rabattkod" placeholder="Rabattkod">
      <!-- button-name: knapp utan tillgängligt namn -->
      <button type="submit"><span aria-hidden="true">&#10148;</span></button>
      <!-- select-name: rullgardin utan etikett -->
      <select name="storlek">
        <option>38</option>
        <option>39</option>
      </select>
    </form>

    <!-- custom-click-handler-not-focusable: div som beter sig som knapp -->
    <div class="falsk-knapp" onclick="alert('lagd i varukorg')">Lagg i varukorg</div>
    <span role="button">Spara till onskelista</span>

    <!--
      Nedan ligger mönster som SKA lämnas i fred. Alla kommer från riktiga
      svenska e-handelssajter där kontrollen tidigare gav falskt larm.
    -->

    <!-- Prisetikett inuti ett klickbart kort. Ärver cursor: pointer men är
         ingen egen knapp — hela kortet är redan en länk. -->
    <a href="/produkt/1" class="kort">
      <span class="rabatt-etikett">70% rabatt</span>
      <span class="titel">Loparskor</span>
    </a>

    <!-- Avstangd overlay som ligger kvar i DOM:en. -->
    <div class="overlay" onclick="void 0">Overlay</div>

    <!-- Skarmlasartext utan yta. -->
    <div class="visually-hidden">Endast for skarmlasare</div>

    <!-- Omslag som innehaller nagot fokuserbart. Atkomligt via innehallet.
         Motsvarar div#__next pa cervera.se och slick-slide-punkterna pa
         jollyroom.se, som bada flaggades fel. -->
    <div class="omslag">
      <button type="button">Riktig knapp</button>
    </div>
    <li class="karusellpunkt" role="presentation">
      <button type="button" tabindex="-1">1</button>
    </li>

    <!-- Menyoverlagg som stanger vid klick. Dolt for hjalpmedel, sa det finns
         en riktig stangknapp nagon annanstans. Motsvarar hemtex.se, som gav
         23 falska larm. -->
    <div class="overlagg" aria-hidden="true" onclick="void 0"></div>

    <!--
      Den har SKA daremot ge utslag. En div med egen cursor: pointer, text och
      ingen fokuserbar foralder ar den klassiska falska knappen. Pa
      royaldesign.se ar motsvarande element en landvaljare som inte gar att na
      med tangentbord.
    -->
    <div class="kort-rubrik">Valj land</div>
  </div>
</body>
</html>
